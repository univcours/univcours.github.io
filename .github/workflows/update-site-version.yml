name: Update UnivCours site version

on:
  push:
    branches: [main]
    paths-ignore:
      - "econometrie-s5-2026/site-version.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: univcours-site-version
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Refresh version after site changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            REV=$(git rev-parse HEAD)
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            printf '{\n  "version": "%s",\n  "updatedAt": "%s"\n}\n' "$REV" "$NOW" > econometrie-s5-2026/site-version.json
            git add econometrie-s5-2026/site-version.json
            if git diff --cached --quiet; then
              echo "Version is already current."
              exit 0
            fi
            git commit -m "Refresh public site version after publishing changes"
            if git push origin HEAD:main; then
              echo "Updated public site version to $REV"
              exit 0
            fi
            sleep 3
          done
          echo "Unable to publish latest version after retries." >&2
          exit 1
